name: patinhas

x-logging: &default-logging
    driver: json-file
    options:
        max-size: 10m
        max-file: '3'

services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: patinhas
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d patinhas']
            interval: 5s
            timeout: 5s
            retries: 10
        logging: *default-logging
        networks: [internal]

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        restart: unless-stopped
        init: true
        depends_on:
            db:
                condition: service_healthy
        env_file: .env
        environment:
            NODE_ENV: production
            HOST: 0.0.0.0
            PORT: '3000'
            LOG_LEVEL: ${LOG_LEVEL:-info}
            DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/patinhas
            SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (32+ characters)}
            TRUST_PROXY: 'true'
            COOKIE_SECURE: ${COOKIE_SECURE:-true}
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
            GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-PatinhasCarentesJoinville/1.0 (contact not set)}
            UPLOAD_DIR: /data/uploads
            SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
            SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
        ports:
            - '127.0.0.1:${API_PORT:-8848}:3000'
        volumes:
            - uploads:/data/uploads
        logging: *default-logging
        networks: [internal]

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        restart: unless-stopped
        depends_on:
            api:
                condition: service_healthy
        ports:
            - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8847}:8080'
        logging: *default-logging
        networks: [internal]

volumes:
    db-data:
    uploads:

networks:
    internal:
