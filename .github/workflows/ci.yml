name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_HOST_AUTH_METHOD: trust
                    POSTGRES_DB: patinhas_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            TEST_DATABASE_URL: postgresql://postgres@localhost:5432/patinhas_test
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run db:generate --workspace @patinhas/api
              env:
                  DATABASE_URL: postgresql://postgres@localhost:5432/patinhas_test
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck
            - run: npm test
            - run: npm audit --audit-level=high

    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Create .env from the example
              run: |
                  cp .env.example .env
                  sed -i "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" .env
            - name: Validate the compose files
              run: |
                  docker compose --env-file .env.example config --quiet
                  docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml config --quiet
            - name: Build the API image
              run: docker build -f apps/api/Dockerfile -t patinhas-api .
            - name: Build the web image
              run: docker build -f apps/web/Dockerfile -t patinhas-web .
